namespace: suertudo
engine:
  url: ws://127.0.0.1:49134
containers:
  # The three registry workers that provide the trigger types the project
  # uses. The engine ships none of them: without these, every trigger stays
  # PENDING forever and the failure is silent.
  # See docs/spike-iii-health.md §5.6.
  http:
    worker: package://api.workers.iii.dev/http
    version: "0.22.7"
  queue:
    worker: package://api.workers.iii.dev/queue
    version: "0.21.22"
  cron:
    worker: package://api.workers.iii.dev/cron
    version: "0.21.26"
  # The project's own workers. The engine URL comes from III_URL, which the
  # compose daemon injects into every container.
  api:
    worker: path://../../services/api
    scripts:
      run: cargo run --release -p suertudo-api
  identity:
    worker: path://../../services/identity
    scripts:
      run: cargo run --release -p suertudo-identity
