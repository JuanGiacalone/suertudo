[package]
name = "suertudo-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "suertudo_identity"
path = "src/lib.rs"

[[bin]]
name = "suertudo-identity"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
suertudo-db = { path = "../db" }
# The identity worker reuses the authorization context of the API worker: the
# `AuthContext` type and the `inject` / `extract` helpers live there and must
# not be duplicated (AGENTS.md §5.2).
suertudo-api = { path = "../api" }

sqlx = { workspace = true }

iii-sdk = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
