# Local development services for Suertudo.
#
# The CI does not need Docker: the smoke test of the spike runs the whole
# iii stack as host processes, without KVM. See docs/spike-iii-health.md.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suertudo
      POSTGRES_USER: suertudo
      POSTGRES_PASSWORD: suertudo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suertudo"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: suertudo
      MINIO_ROOT_PASSWORD: suertudo

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
