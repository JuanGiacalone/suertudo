# The pipeline of the backend and of the two clients.
#
# The jobs and their order are not arbitrary: the cheapest and most
# informative go first, so that a mistake is caught in seconds and not in
# minutes.
#
#   rust      the workspace: format, lints, tests, audit. Needs a Postgres.
#   flutter   the app of the participants: analyze, format, tests.
#   nextjs    the panel of the businesses: lint, types, build.
#
# The smoke test of the whole iii stack is NOT here: it is in
# `smoke.yml`, because it needs the engine, the network and minutes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# A push that lands while the pipeline of the previous one is running
# makes that previous one obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The pipeline only reads the repository. It writes nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The database of the tests. This is at the level of the WORKFLOW, so
  # every step of every job receives it: the harness of the tests reads
  # `DATABASE_URL_TEST`, applies the migrations itself and creates the
  # role of the application.
  DATABASE_URL_TEST: postgres://suertudo:suertudo@127.0.0.1:5432/suertudo_test

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: suertudo
          POSTGRES_PASSWORD: suertudo
          POSTGRES_DB: suertudo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U suertudo"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # The version comes from rust-toolchain.toml, so the pipeline builds
        # with the same compiler that a developer has locally. Installing
        # rustup without a default toolchain lets the file decide.
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            spikes/iii-health -> target

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lints
        # `--locked` everywhere: without it, cargo is free to re-resolve
        # the dependencies, and the pipeline would be auditing and testing
        # a tree that is not the one that is committed.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: The offline cache of sqlx matches the schema
        # The build with a live database and the cache directory of the
        # repository expands the macros against the real schema and WRITES
        # the cache. A query that changed without regenerating the cache
        # leaves a new file behind, and this step sees it.
        #
        # It runs AFTER the tests, because the migrations are applied by the
        # harness of the tests: the schema has to exist before the macros
        # are expanded against it.
        #
        # SQLX_OFFLINE=false is explicit on purpose, and the reason is
        # narrow: it is a guard against somebody turning the offline mode
        # on for the rest of the pipeline. Today it changes nothing,
        # because with DATABASE_URL set and SQLX_OFFLINE unset, sqlx
        # already expands the macros against the live schema, and that is
        # what this step needs.
        #
        # The other half of the story, the reason the cache is committed at
        # all: with NO DATABASE_URL, the macros fall back to the committed
        # cache, and that is how a clean checkout compiles without a
        # database. The check below needs the opposite of that.
        #
        # Only `services/db` holds sqlx macros, so building that crate
        # expands all of them.
        #
        # What this check does NOT see: a query that was REMOVED leaves its
        # cache file behind, because the expansion never prunes. That is
        # what `cargo sqlx prepare` is for, and it is not installed here.
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
          SQLX_OFFLINE: false
          SQLX_OFFLINE_DIR: ${{ github.workspace }}/services/db/.sqlx
        run: |
          # `sqlx::migrate!` embeds the migrations at compile time: touching
          # the crate forces the macros to be expanded again.
          touch services/db/src/lib.rs
          cargo build -p suertudo-db --locked
          if [ -n "$(git status --porcelain services/db/.sqlx)" ]; then
            echo "::error::the offline cache of sqlx does not match the schema."
            echo "Regenerate it: SQLX_OFFLINE_DIR=\$PWD/services/db/.sqlx DATABASE_URL=\$DATABASE_URL cargo build -p suertudo-db"
            git status --porcelain services/db/.sqlx
            exit 1
          fi

      - name: Vulnerabilities
        # The version of the scanner is pinned, like every other version in
        # this pipeline. It is the one that the audit was run with when the
        # lockfiles were last verified, and it moves with a pull request
        # of its own, like the version of the engine.
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          # The spike has its own lockfile and its own pin of the SDK: it is
          # a separate dependency tree, and it has to be audited on its own.
          cargo audit --file spikes/iii-health/Cargo.lock

  flutter:
    name: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # The exact version that a developer has locally: the pipeline has
          # to prove what runs on the machine, not what runs on the latest
          # release of the day.
          flutter-version: '3.47.7'
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: No focused tests
        # Dart has no `forbidOnly`: a leftover `test.only` makes the suite
        # run ONE test and exit 0. The pipeline goes green while the rest
        # of the suite never ran, and nobody finds out until the bug that
        # the skipped test would have caught shows up in production.
        run: |
          # The scan and the verdict are two separate things, and the exit
          # status of the scan is checked on its own. A pipeline of two
          # greps loses the status of the first one, and a scan that never
          # ran looks EXACTLY like a clean repository: AGENTS.md §9 says
          # that a check which only looks for the absence of an error
          # reports PASS when nothing ran.
          scan="$(grep -rn --include='*_test.dart' -E '\b(test|testWidgets|group)\.only\b' . 2>&1)" && status=0 || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::the scan of the focused tests failed"
            echo "$scan"
            exit 1
          fi

          # The lines that START with `//` are exempt: a test file that
          # documents the rule would otherwise turn the pipeline red, and
          # that is the kind of check people learn to work around. A
          # mention inside a block comment, or at the end of a line of
          # code, still fails the step, and that is deliberate: a false
          # positive costs a red pipeline for a minute, and a false
          # negative is a suite that silently does not run.
          # `|| true` on purpose: with only exempt comments, the filter
          # selects nothing and grep exits 1, and `bash -e` would kill the
          # step BEFORE the verdict below is evaluated.
          focused="$(printf '%s\n' "$scan" | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)"
          if [ -n "$focused" ]; then
            echo "::error::a focused test would make this pipeline run one test and pass"
            echo "$focused"
            exit 1
          fi

      - name: Tests
        run: flutter test

  nextjs:
    name: nextjs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/business-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The version comes from the file, so the pipeline builds with the
          # Node that a developer has locally. One source of truth.
          node-version-file: apps/business-web/.nvmrc
          cache: npm
          cache-dependency-path: apps/business-web/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
